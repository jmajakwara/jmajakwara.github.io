<style id="site-style">
/* Layout: an academic record. Pale-blue page, a hero carrying a survival curve with a cure plateau,
   then sections set as a narrow label column beside the content column. */
:root {
  --bg: #e6f0fa;
  --bg-deep: #d5e5f5;
  --surface: #f5f9fe;
  --ink: #0f2236;
  --muted: #4b6079;
  --line: #bfd3e8;
  --accent: #1a5590;
  --accent-soft: #d0e2f4;
  --plateau: #c06a1a;
  --danger: #a3312b;
  --font-display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --measure: 68ch;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1825; --bg-deep: #10202f; --surface: #132637; --ink: #e2edf8; --muted: #94aac0;
    --line: #26405a; --accent: #84bdf0; --accent-soft: #1b3550; --plateau: #f0a560; --danger: #f08a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1825; --bg-deep: #10202f; --surface: #132637; --ink: #e2edf8; --muted: #94aac0;
  --line: #26405a; --accent: #84bdf0; --accent-soft: #1b3550; --plateau: #f0a560; --danger: #f08a80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
}
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Hero */
.hero { background: linear-gradient(180deg, var(--bg-deep), var(--bg)); border-bottom: 1px solid var(--line); }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 40px; align-items: center; padding-block: 56px 44px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
h1 { font-family: var(--font-display); font-weight: 500; font-size: clamp(40px, 6.4vw, 68px); line-height: 1.02; letter-spacing: -.015em; margin: 0 0 16px; text-wrap: balance; }
.role { font-size: 18px; color: var(--muted); margin: 0 0 22px; max-width: 46ch; }
.role strong { color: var(--ink); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 26px; padding: 0; list-style: none; }
.chip { font-size: 13px; padding: 5px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); }
.links { display: flex; flex-wrap: wrap; gap: 10px 18px; font-size: 14px; }
.links a { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.orcid-id { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.curve { width: 100%; max-width: 440px; justify-self: end; margin: 0; }
.curve svg { display: block; width: 100%; height: auto; overflow: visible; }
.curve figcaption { font-size: 12.5px; color: var(--muted); margin-top: 8px; font-style: italic; font-family: var(--font-display); }

/* Stats strip */
.stats { display: flex; flex-wrap: wrap; gap: 12px 40px; padding: 18px 0 0; margin: 26px 0 0; border-top: 1px solid var(--line); }
.stat b { display: block; font-family: var(--font-display); font-size: 28px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }

/* Sections */
main .wrap { padding-block: 12px 64px; }
section.block { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; padding: 36px 0 8px; }
section.block + section.block { border-top: 1px solid var(--line); margin-top: 28px; }

/* Tab bar */
.tabbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: var(--bg); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 16; background: var(--bg); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0; padding: 0; list-style: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { font: inherit; font-size: 14.5px; font-weight: 500; white-space: nowrap; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); padding: 14px 14px 11px; cursor: pointer; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab .n { font-family: var(--font-mono); font-size: 11.5px; margin-left: 6px; color: var(--muted); font-weight: 400; }
.panel[hidden] { display: none !important; }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.tile { display: grid; gap: 4px; align-content: start; text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 16px 14px; cursor: pointer; text-decoration: none; transition: border-color .15s, transform .15s; }
.tile:hover { border-color: var(--accent); transform: translateY(-2px); }
.tile b { font-family: var(--font-display); font-size: 30px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
.tile .t-label { font-size: 14px; font-weight: 600; }
.tile .t-sub { font-size: 12.5px; color: var(--muted); }
.tile.link b { font-size: 18px; font-family: var(--font-body); font-weight: 600; color: var(--ink); }
.recent { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.recent li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; }
.recent .y { font-family: var(--font-mono); font-size: 13px; color: var(--accent); padding-top: 3px; }
.recent .pub-title { font-size: 17px; }
.more { font: inherit; font-size: 14px; font-weight: 500; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } .tile:hover { transform: none; } }
section.block:last-of-type { border-bottom: 0; }
.block-head h2 { font-family: var(--font-display); font-size: 28px; font-weight: 500; margin: 0; line-height: 1.15; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.block-head .count { display: block; font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-top: 6px; font-weight: 400; }
.block-body { min-width: 0; }
.prose p { max-width: var(--measure); margin: 0 0 14px; }

/* Publications */
.pub-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 26px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.seg button { font: inherit; font-size: 13.5px; border: 0; background: transparent; color: var(--muted); padding: 5px 14px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.search { flex: 1 1 200px; min-width: 0; font: inherit; font-size: 14px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); }
.year-group { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 18px; }
.year-group + .year-group { margin-top: 26px; }
.year { font-family: var(--font-mono); font-size: 14px; color: var(--accent); padding-top: 3px; font-variant-numeric: tabular-nums; }
.pubs { list-style: none; margin: 0; padding: 0; display: grid; gap: 20px; }
.pub { max-width: var(--measure); }
.pub-title { font-family: var(--font-display); font-size: 19px; line-height: 1.3; font-weight: 500; margin: 0 0 4px; text-wrap: pretty; }
.pub-authors { font-size: 14.5px; color: var(--muted); margin: 0 0 2px; }
.pub-authors .me { color: var(--ink); font-weight: 600; }
.pub-venue { font-size: 14.5px; margin: 0; }
.pub-venue em { font-style: italic; }
.pub-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; font-size: 13px; }
.tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); padding: 1px 7px; border-radius: 4px; }
.doi { font-family: var(--font-mono); font-size: 12.5px; }
.empty-note { color: var(--muted); font-style: italic; }

/* Generic record tables (supervision, review, teaching) */
.records { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.record { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 20px; padding: 14px 0; border-top: 1px solid var(--line); }
.record:first-child { border-top: 0; padding-top: 0; }
.record h3 { font-size: 16px; font-weight: 600; margin: 0; }
.record p { margin: 2px 0 0; font-size: 14.5px; color: var(--muted); max-width: var(--measure); }
.record .when { font-family: var(--font-mono); font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.status { display: inline-block; font-size: 12px; padding: 1px 9px; border-radius: 999px; margin-left: 8px; vertical-align: 2px; font-weight: 500; }
.status.current { background: var(--accent-soft); color: var(--accent); }
.status.completed { border: 1px solid var(--line); color: var(--muted); }
.subhead { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.subhead:not(:first-child) { margin-top: 28px; }

/* Contact */
.contact-line { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.email { font-family: var(--font-mono); font-size: 15px; user-select: all; }
.btn { font: inherit; font-size: 13.5px; font-weight: 500; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.danger { color: var(--danger); }
.btn.small { font-size: 12.5px; padding: 3px 10px; }
footer { border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
footer .wrap { padding-block: 22px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; }

/* Owner editing */
.edit-only { display: none; }
body.editing .edit-only { display: revert; }
body.editing .item-actions { display: flex; }
.item-actions { display: none; gap: 6px; margin-top: 8px; }
.add-row { margin-top: 18px; }
.owner-bar {
  position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px; z-index: 20;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 14px;
  box-shadow: 0 6px 24px rgba(15, 34, 54, .14); font-size: 13px; max-width: calc(100vw - 32px);
}
.owner-bar .msg { color: var(--muted); }
.owner-bar .msg.dirty { color: var(--plateau); font-weight: 600; }
.edit-banner { background: var(--accent-soft); border-bottom: 1px solid var(--line); font-size: 14px; }
.edit-banner .wrap { padding-block: 10px; }
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(10, 24, 40, .45); }
dialog form { padding: 22px 22px 18px; display: grid; gap: 14px; }
dialog h3 { font-family: var(--font-display); font-weight: 500; font-size: 22px; margin: 0; }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; font-weight: 600; }
.field .hint { font-size: 12px; color: var(--muted); }
.field input, .field textarea, .field select { font: inherit; font-size: 14.5px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 100%; }
.field textarea { min-height: 96px; resize: vertical; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

@media (max-width: 800px) {
  .hero .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; padding-block: 36px 30px; }
  .curve { justify-self: start; max-width: 360px; }
  section.block { padding: 26px 0 4px; }
  .year-group { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .record { grid-template-columns: minmax(0, 1fr); }
  .record .when { text-align: left; }
}
@media (prefers-reduced-motion: no-preference) {
  .km-path { stroke-dasharray: 900; stroke-dashoffset: 0; animation: draw 1.6s ease-out; }
  @keyframes draw { from { stroke-dashoffset: 900; } to { stroke-dashoffset: 0; } }
}
</style>

    }

  /* ---------- Rendering ---------- */
  function curveSVG() {
    // Kaplan–Meier style step curve levelling to a cure fraction.
    var pts = [[0,1],[30,1],[30,.92],[52,.92],[52,.83],[70,.83],[70,.74],[95,.74],[95,.66],[118,.66],[118,.58],[150,.58],[150,.52],[182,.52],[182,.47],[220,.47],[220,.44],[268,.44],[268,.42],[360,.42]];
    var x0 = 34, y0 = 16, w = 360, h = 200;
    function X(t) { return x0 + t * (w / 360); }
    function Y(s) { return y0 + (1 - s) * h; }
    var d = pts.map(function (p, i) { return (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1); }).join(" ");
    var cens = [[40,.92],[84,.74],[130,.58],[200,.47],[240,.44],[300,.42],[335,.42]];
    var ticks = cens.map(function (c) { var x = X(c[0]), y = Y(c[1]); return '<path d="M' + x + ' ' + (y - 5) + 'V' + (y + 5) + '" stroke="var(--accent)" stroke-width="1.4"/>'; }).join("");
    return '<svg viewBox="0 0 420 252" role="img" aria-label="Survival curve that levels off at a cure fraction">' +
      '<line x1="' + x0 + '" y1="' + y0 + '" x2="' + x0 + '" y2="' + (y0 + h) + '" stroke="var(--line)" stroke-width="1"/>' +
      '<line x1="' + x0 + '" y1="' + (y0 + h) + '" x2="' + (x0 + w) + '" y2="' + (y0 + h) + '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + (x0 - 8) + '" y="' + (Y(1) + 4) + '" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--muted)">1.0</text>' +
      '<text x="' + (x0 - 8) + '" y="' + (Y(.5) + 4) + '" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--muted)">0.5</text>' +
      '<text x="' + (x0 - 8) + '" y="' + (Y(0) + 4) + '" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--muted)">0</text>' +
      '<text x="' + (x0 + w) + '" y="' + (y0 + h + 22) + '" text-anchor="end" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="14" fill="var(--muted)">t</text>' +
      '<text x="' + (x0 + 30) + '" y="' + (y0 + 26) + '" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="14" fill="var(--muted)">S(t)</text>' +
      '<line x1="' + x0 + '" y1="' + Y(.42) + '" x2="' + (x0 + w) + '" y2="' + Y(.42) + '" stroke="var(--plateau)" stroke-width="1" stroke-dasharray="3 4"/>' +
      '<path class="km-path" d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="miter"/>' +
      ticks +
      '<text x="' + (x0 + w) + '" y="' + (Y(.42) + 18) + '" text-anchor="end" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="13.5" fill="var(--plateau)">cure fraction p₀</text>' +
      '</svg>';
  }

    var journalYears = pubs.filter(function (x) { return x.type !== "thesis"; }).map(function (x) { return +x.year; }).filter(Boolean);

    var stats = '<div class="stats">' +

  function pubsHTML() {
    var all = state.publications.slice().sort(function (a, b) { return (b.year - a.year) || String(a.title).localeCompare(b.title); });
    var q = query.trim().toLowerCase();
    var list = all.filter(function (p) {
      if (filter === "articles" && p.type === "thesis") return false;
      if (filter === "theses" && p.type !== "thesis") return false;
      if (q && (p.title + " " + p.authors + " " + p.venue + " " + p.year).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    var nArt = all.filter(function (p) { return p.type !== "thesis"; }).length;
    var nTh = all.length - nArt;
    var byYear = {};
    list.forEach(function (p) { (byYear[p.year] = byYear[p.year] || []).push(p); });
    var years = Object.keys(byYear).sort(function (a, b) { return b - a; });
    var groups = years.map(function (y) {
      return '<div class="year-group"><div class="year">' + esc(y) + '</div><ul class="pubs">' + byYear[y].map(function (p) {

        if (doi) meta.push('<a class="doi" href="https://doi.org/' + esc(doi) + '" target="_blank" rel="noopener">doi:' + esc(doi) + '</a>');
        if (safeUrl(p.url)) meta.push('<a href="' + esc(safeUrl(p.url)) + '" target="_blank" rel="noopener">Link ↗</a>');
        if (safeUrl(p.code)) meta.push('<a href="' + esc(safeUrl(p.code)) + '" target="_blank" rel="noopener">Code ↗</a>');
        return '<li class="pub"><p class="pub-title">' + esc(p.title) + '</p>' +
          '<p class="pub-authors">' + markMe(p.authors) + '</p>' +

          (meta.length ? '<div class="pub-meta">' + meta.join("") + '</div>' : '') +

    var tools = '<div class="pub-tools"><div class="seg" role="group" aria-label="Filter publications">' +

      '<input class="search" id="pub-search" type="search" placeholder="Search titles, co-authors, journals" value="' + esc(query) + '" aria-label="Search publications"></div>';
    return sectionWrap("publications", "Publications", nArt + " articles · " + nTh + " theses",
      tools + '<div id="pub-list">' + (groups || '<p class="empty-note">No publications match that search.</p>') + '</div>' + addButton("publications"));

  /* ---------- Editor dialog ---------- */
  var dlg = document.createElement("dialog");
  document.body.appendChild(dlg);

  function openEditor(section, id) {
    var schema = section === "profile" ? null : SCHEMAS[section];
    var item, fields, title;
    if (section === "profile") {
      var p = state.profile;
      item = { name: p.name, title: p.title, unit: p.unit, institution: p.institution, email: p.email, orcid: p.orcid,
        interests: (p.interests || []).join(", "), bio: p.bio,
        links: (p.links || []).map(function (l) { return l.label + " | " + l.url; }).join("\n") };
      fields = [
        { k: "name", label: "Name", req: true }, { k: "title", label: "Position" }, { k: "unit", label: "School or department" },
        { k: "institution", label: "Institution" }, { k: "email", label: "Email" }, { k: "orcid", label: "ORCID iD" },
        { k: "interests", label: "Research interests", hint: "Separate with commas" },
        { k: "bio", label: "About", type: "textarea", hint: "Leave a blank line between paragraphs" },
        { k: "links", label: "Profile links", type: "textarea", hint: "One per line: Label | https://…" }
      ];
      title = "Edit profile";
    } else {
      item = id ? state[section].find(function (x) { return x.id === id; }) : {};
      fields = schema.fields;
      title = (id ? "Edit " : "Add ") + schema.label;
    }
    var html = '<form method="dialog" id="ed-form"><h3>' + esc(title) + '</h3>' + fields.map(function (f) {
      var v = item && item[f.k] != null ? item[f.k] : "";
      var fid = "ed-" + f.k;
      var input;
      if (f.type === "select") {
        input = '<select id="' + fid + '" name="' + f.k + '">' + f.options.map(function (o) {
          return '<option value="' + esc(o[0]) + '"' + (String(v) === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
        }).join("") + '</select>';
      } else if (f.type === "textarea") {
        input = '<textarea id="' + fid + '" name="' + f.k + '">' + esc(v) + '</textarea>';
      } else {
        input = '<input id="' + fid + '" name="' + f.k + '" type="' + (f.type || "text") + '" value="' + esc(v) + '"' + (f.req ? ' required' : '') + '>';
      }
      return '<div class="field"><label for="' + fid + '">' + esc(f.label) + '</label>' + input + (f.hint ? '<span class="hint">' + esc(f.hint) + '</span>' : '') + '</div>';
    }).join("") + '<div class="dialog-actions"><button type="button" class="btn" data-act="close-dlg">Cancel</button><button type="submit" class="btn primary">Save</button></div></form>';
    dlg.innerHTML = html;
    dlg.querySelector("#ed-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var fd = new FormData(e.target), out = {};
      fields.forEach(function (f) { out[f.k] = String(fd.get(f.k) || "").trim(); });
      if (section === "profile") {
        var p = state.profile;
        p.name = out.name; p.title = out.title; p.unit = out.unit; p.institution = out.institution; p.email = out.email; p.orcid = out.orcid; p.bio = out.bio;
        p.interests = out.interests.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
        p.links = out.links.split("\n").map(function (line) {
          var parts = line.split("|"); if (parts.length < 2) return null;
          return { label: parts[0].trim(), url: parts.slice(1).join("|").trim() };
        }).filter(function (l) { return l && l.label && safeUrl(l.url); });
      } else {
        if (out.year) out.year = parseInt(out.year, 10) || out.year;
        if (id) { Object.assign(item, out); }
        else { out.id = uid(); state[section].push(out); }
      }
      markDirty(); dlg.close(); render();
    });
    dlg.showModal();
    var first = dlg.querySelector("input,textarea,select"); if (first) first.focus();
  }

  function markDirty() {
    dirty = true;
    state.updated = new Date().toISOString().slice(0, 10);
    try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify(state)); } catch (e) {}
  }

  /* ---------- Publishing the new version ---------- */
  function buildDocument() {
    var css = document.getElementById("site-style").textContent;
    var js = document.getElementById("site-app").textContent;
    var data = JSON.stringify(state, null, 2).replace(/</g, "\\u003c");
    return SKELETON_HEAD +
      '<title>' + esc(state.profile.name) + '</title>\n' +
      '<meta name="claude:viewport-fit-sides" content="cover">\n' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">\n' +
      '<style id="site-style">' + css + '</style>\n' +
      '<div id="app"></div>\n' +
      '<script type="application/json" id="site-data">' + data + '</' + 'script>\n' +
      '<script id="site-app">' + js + '</' + 'script>' +
      '</body></html>';
  }

  function setMsg(text, isDirty) {
    var m = document.getElementById("owner-msg");
    if (m) { m.textContent = text; m.classList.toggle("dirty", !!isDirty); }
  }

  function publish() {
    if (!artifactNs) { setMsg("Saving isn't available in this view"); return; }
    setMsg("Publishing…");
    try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify(state)); } catch (e) {}
    artifactNs.publish(buildDocument()).then(function () {
      try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {}
      setMsg("Published");
    }).catch(function (err) {
      var code = err && err.code;
      if (code === "conflict") { setMsg("A newer version was published; reloading"); return; }
      if (code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "capability_disabled" || code === "not_declared") {
        canEdit = false; editing = false; render(); return;
      }
      if (code === "rate_limited") { setMsg("Too many saves. Wait a minute, then publish again", true); return; }
      if (code === "too_large") { setMsg("The page is too large to save", true); return; }
      setMsg("Couldn't publish. Try again shortly", true);
    });
  }

  /* ---------- Events ---------- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act],[data-filter],[data-tab]");
    if (!b) return;
    if (b.dataset.filter) { filter = b.dataset.filter; rerenderPubs(); return; }
    if (b.dataset.tab) { showTab(b.dataset.tab, !b.classList.contains("tab")); return; }
    var act = b.dataset.act, sec = b.dataset.sec, id = b.dataset.id;
    if (act === "copy") {
      var t = state.profile.email, msg = document.getElementById("copy-msg");
      var done = function () { if (msg) msg.textContent = "Copied"; };
      var fallback = function () {
        var r = document.createRange(); r.selectNodeContents(document.getElementById("email-text"));
        var s = getSelection(); s.removeAllRanges(); s.addRange(r);
        if (msg) msg.textContent = "Selected. Press Ctrl+C to copy";
      };
      try { navigator.clipboard.writeText(t).then(done, fallback); } catch (err) { fallback(); }
      return;
    }
    if (!canEdit) return;
    if (act === "start-edit") { editing = true; render(); }
    else if (act === "cancel-edit") {
      if (dirty) { state = JSON.parse(JSON.stringify(saved)); dirty = false; try { sessionStorage.removeItem(DRAFT_KEY); } catch (err) {} }
      editing = false; render();
    }
    else if (act === "publish") publish();
    else if (act === "add") openEditor(sec);
    else if (act === "edit") openEditor(sec, id);
    else if (act === "profile") openEditor("profile");
    else if (act === "close-dlg") dlg.close();
    else if (act === "del") {
      if (b.dataset.confirm === "1") {
        state[sec] = state[sec].filter(function (x) { return x.id !== id; });
        markDirty(); render();
      } else {
        b.dataset.confirm = "1"; b.textContent = "Confirm delete";
        setTimeout(function () { if (b.isConnected) { b.dataset.confirm = ""; b.textContent = "Delete"; } }, 4000);
      }
    }
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "pub-search") { query = e.target.value; rerenderPubs(); }
  });

  render();

})();
</script>
</body>
</html>
